<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="45" fill="#f5f3f0"/>
  <circle cx="50" cy="50" r="40" fill="#ffd700" opacity="0.2"/>
  <!-- Pocket watch -->
  <circle cx="50" cy="50" r="28" fill="#ffd700" stroke="#b8860b" stroke-width="3"/>
  <circle cx="50" cy="50" r="22" fill="#fffef5"/>
  <circle cx="50" cy="50" r="2" fill="#3a3532"/>
  <!-- Clock hands -->
  <line x1="50" y1="50" x2="50" y2="32" stroke="#3a3532" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="62" y2="50" stroke="#3a3532" stroke-width="2" stroke-linecap="round"/>
  <!-- Hour markers -->
  <circle cx="50" cy="30" r="2" fill="#3a3532"/>
  <circle cx="70" cy="50" r="2" fill="#3a3532"/>
  <circle cx="50" cy="70" r="2" fill="#3a3532"/>
  <circle cx="30" cy="50" r="2" fill="#3a3532"/>
  <!-- Chain -->
  <ellipse cx="50" cy="18" rx="8" ry="4" fill="none" stroke="#b8860b" stroke-width="2"/>
</svg>
