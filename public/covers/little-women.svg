<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="parlor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513"/>
      <stop offset="100%" style="stop-color:#5d3a1a"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4500"/>
      <stop offset="50%" style="stop-color:#ff8c00"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#parlor)"/>
  <!-- Fireplace -->
  <rect x="140" y="80" width="120" height="100" fill="#3a3532"/>
  <rect x="130" y="70" width="140" height="15" fill="#5d3a1a"/>
  <rect x="150" y="100" width="100" height="80" fill="#1a1a1a"/>
  <!-- Fire -->
  <ellipse cx="200" cy="165" rx="35" ry="20" fill="url(#fire)"/>
  <ellipse cx="190" cy="155" rx="15" ry="25" fill="#ffd700"/>
  <ellipse cx="210" cy="155" rx="12" ry="20" fill="#ffd700"/>
  <!-- Warm glow -->
  <circle cx="200" cy="140" r="80" fill="#ff8c00" opacity="0.1"/>
  <!-- Four figures (sisters) silhouettes -->
  <ellipse cx="80" cy="150" rx="20" ry="25" fill="#2a2520"/>
  <circle cx="80" cy="120" r="12" fill="#2a2520"/>
  <ellipse cx="120" cy="155" rx="18" ry="22" fill="#2a2520"/>
  <circle cx="120" cy="128" r="10" fill="#2a2520"/>
  <ellipse cx="280" cy="150" rx="20" ry="25" fill="#2a2520"/>
  <circle cx="280" cy="120" r="12" fill="#2a2520"/>
  <ellipse cx="320" cy="158" rx="15" ry="18" fill="#2a2520"/>
  <circle cx="320" cy="135" r="9" fill="#2a2520"/>
  <!-- Book on mantle -->
  <rect x="270" y="60" width="25" height="8" fill="#8b0000"/>
  <rect x="175" y="58" width="20" height="10" fill="#2e4a2e"/>
</svg>
